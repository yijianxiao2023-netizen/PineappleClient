name: Build DMG and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Fabric mod
        run: ./build_mod.sh

      - name: Build PineappleClient.app and .dmg
        run: ./packaging/macos/build_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/PineappleClient.dmg
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete client-latest --yes --cleanup-tag || true
          gh release create client-latest dist/PineappleClient.dmg \
            --target "${{ github.sha }}" \
            --title "PineappleClient (latest build)" \
            --notes "macOS build of PineappleClient for Minecraft 1.21.1, built from ${{ github.sha }}. Open the .dmg, drag PineappleClient to Applications, then right-click > Open the first time." \
            --latest

  pages:
    needs: dmg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: docs/downloads

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
